<p-toast />
<p-dataview [value]="products" [layout]="viewLayout">
  <ng-template #header>
    @if (showLayoutToggle) {
      <div class="flex justify-end">
        <p-select-button [(ngModel)]="viewLayout" [options]="layoutOptions" [allowEmpty]="false">
          <ng-template #item let-option>
            <i class="pi" [ngClass]="{ 'pi-bars': option === 'list', 'pi-table': option === 'grid' }"></i>
          </ng-template>
        </p-select-button>
      </div>
    }
  </ng-template>

  <ng-template #list let-items>
    <div class="flex flex-col">
      @for (item of items; track trackProduct(item, $index); let i = $index) {
        <app-product-card [product]="item" layout="list" [showDivider]="i !== 0" />
      }
    </div>
  </ng-template>

  <ng-template #grid let-items>
    <div class="grid grid-cols-12 gap-4">
      @for (item of items; track trackProduct(item, $index)) {
        <div [class]="gridItemClass()">
          <app-product-card [product]="item" layout="grid" />
        </div>
      }
    </div>
  </ng-template>
</p-dataview>
