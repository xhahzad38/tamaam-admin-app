<div class="flex flex-col gap-4">
    <div class="form-grid">
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-name'" class="text-sm font-medium">Name</label>
            <input [id]="idPrefix + '-name'" pInputText [(ngModel)]="tier().name" (ngModelChange)="changed.emit()" maxlength="100" />
        </div>
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-code'" class="text-sm font-medium">Code</label>
            <input [id]="idPrefix + '-code'" pInputText [(ngModel)]="tier().code" (ngModelChange)="changed.emit()" maxlength="40" class="font-mono uppercase" />
        </div>
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-sort'" class="text-sm font-medium">Sort order</label>
            <p-inputnumber [inputId]="idPrefix + '-sort'" [(ngModel)]="tier().sortOrder" (ngModelChange)="changed.emit()" [min]="0" fluid />
        </div>
    </div>

    <div class="form-grid">
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-long'" class="text-sm font-medium">Longest side (max)</label>
            <p-inputnumber [inputId]="idPrefix + '-long'" [(ngModel)]="tier().maxLongestCm" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="1" suffix=" cm" placeholder="No limit" fluid />
        </div>
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-median'" class="text-sm font-medium">Middle side (max)</label>
            <p-inputnumber [inputId]="idPrefix + '-median'" [(ngModel)]="tier().maxMedianCm" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="1" suffix=" cm" placeholder="No limit" fluid />
        </div>
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-short'" class="text-sm font-medium">Shortest side (max)</label>
            <p-inputnumber [inputId]="idPrefix + '-short'" [(ngModel)]="tier().maxShortestCm" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="1" suffix=" cm" placeholder="No limit" fluid />
        </div>
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-maxkg'" class="text-sm font-medium">Shipping weight (max)</label>
            <p-inputnumber [inputId]="idPrefix + '-maxkg'" [(ngModel)]="tier().maxShippingKg" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="3" suffix=" kg" placeholder="No limit" fluid />
        </div>
        <div class="flex flex-col gap-1">
            <label [for]="idPrefix + '-pack'" class="text-sm font-medium">Packaging weight</label>
            <p-inputnumber [inputId]="idPrefix + '-pack'" [(ngModel)]="tier().packagingKg" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="3" suffix=" kg" fluid />
        </div>
        <div class="flex items-center gap-2 self-end pb-2">
            <p-checkbox [inputId]="idPrefix + '-vol'" [(ngModel)]="tier().useVolumetricWeight" (ngModelChange)="changed.emit()" [binary]="true" />
            <label [for]="idPrefix + '-vol'" class="cursor-pointer text-sm">Charge by volumetric weight when higher</label>
        </div>
    </div>

    <div>
        <div class="mb-2 flex items-center justify-between">
            <h4 class="m-0 text-sm font-semibold">Weight-band fees</h4>
            <p-button label="Add band" icon="pi pi-plus" size="small" [text]="true" (onClick)="addSlab()" />
        </div>
        <p-table [value]="tier().slabs" responsiveLayout="scroll" styleClass="p-datatable-sm">
            <ng-template #header>
                <tr>
                    <th>Fee type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Fee</th>
                    <th>Then, per extra</th>
                    <th>Add</th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template #body let-slab>
                <tr>
                    <td class="min-w-52">
                        <p-select [options]="kindOptions()" optionLabel="label" optionValue="value" [(ngModel)]="slab.kind" (ngModelChange)="changed.emit()" appendTo="body" fluid />
                    </td>
                    <td class="min-w-28"><p-inputnumber [(ngModel)]="slab.fromKg" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="3" suffix=" kg" fluid /></td>
                    <td class="min-w-28">
                        <p-inputnumber [(ngModel)]="slab.toKg" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="3" suffix=" kg" placeholder="No limit" fluid />
                    </td>
                    <td class="min-w-32"><p-inputnumber [(ngModel)]="slab.fee" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="2" [prefix]="currency() + ' '" fluid /></td>
                    <td class="min-w-28">
                        <p-inputnumber [(ngModel)]="slab.stepKg" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="3" suffix=" kg" placeholder="—" fluid />
                    </td>
                    <td class="min-w-32">
                        <p-inputnumber [(ngModel)]="slab.feePerStep" (ngModelChange)="changed.emit()" [min]="0" [maxFractionDigits]="2" [prefix]="currency() + ' '" placeholder="—" fluid />
                    </td>
                    <td class="text-right">
                        <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" size="small" ariaLabel="Remove band" (onClick)="removeSlab(slab)" />
                    </td>
                </tr>
                @if (slabError(slab); as message) {
                    <tr>
                        <td colspan="7" class="text-sm text-danger">{{ message }}</td>
                    </tr>
                }
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="7" class="text-center text-sm text-muted-color">No fees yet. Add a weight band.</td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <div class="flex justify-end">
        <p-button label="Remove tier" icon="pi pi-trash" severity="danger" [outlined]="true" size="small" (onClick)="remove.emit()" />
    </div>
</div>
