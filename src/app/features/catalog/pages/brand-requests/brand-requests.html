<div class="page">
    <app-page-header title="Brand change requests" subtitle="Pending edits to name, slug, description, or logo. Brands created here are already approved." [crumbs]="crumbs" />

    <div class="card">
        <div class="mb-4">
            <app-search-control (searchChange)="onSearch($event)" />
        </div>

        @if (error(); as message) {
            <app-error-state [message]="message" [retryable]="false" />
        }

        <p-table [value]="items()" [loading]="loading()" responsiveLayout="scroll">
            <ng-template #header>
                <tr>
                    <th>Brand</th>
                    <th>Field</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Status</th>
                    <th>Requested</th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template #body let-request>
                <tr>
                    <td class="font-medium">{{ request.brandName }}</td>
                    <td>{{ request.fieldName }}</td>
                    <td class="max-w-48 break-all">{{ request.oldValue || '—' }}</td>
                    <td class="max-w-48 break-all">{{ request.newValue || '—' }}</td>
                    <td>{{ statusLabel(request.approvalStatus) }}</td>
                    <td>{{ request.createdAt | date: 'medium' }}</td>
                    <td class="whitespace-nowrap">
                        <p-button label="Approve" size="small" class="mr-2" [loading]="actingId() === request.id" (onClick)="review(request, true)" />
                        <p-button label="Reject" size="small" severity="danger" [outlined]="true" [disabled]="actingId() === request.id" (onClick)="review(request, false)" />
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td [attr.colspan]="7"><app-empty-state title="No pending brand requests" /></td>
                </tr>
            </ng-template>
        </p-table>

        <div class="mt-3 flex justify-end">
            <p-paginator
                (onPageChange)="pageChange($event)"
                [first]="first()"
                [rows]="rows()"
                [totalRecords]="totalRecords()"
                [rowsPerPageOptions]="[10, 20, 30]"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            />
        </div>
    </div>
</div>
