<div class="page">
    <app-page-header [title]="warehouse()?.name || 'New fulfillment center'" [crumbs]="crumbs" />

    <div class="card">
        @if (warehouse(); as item) {
            <p class="m-0 mt-1 font-mono text-sm text-muted-color">{{ item.code }} · {{ item.offerCount }} FBT offer(s)</p>
        } @else {
            <p class="m-0 mt-1 text-sm text-muted-color">Sellers send FBT stock here. A code such as FC-KHI-XXXXX is assigned when you save.</p>
        }

        <form [formGroup]="form" class="mt-6 grid gap-5 md:grid-cols-2" (ngSubmit)="save()">
            <div class="flex flex-col gap-2">
                <label for="fc-name" class="font-medium">Name <span class="text-red-600">*</span></label>
                <app-input-control inputId="fc-name" label="Name" [control]="control('name')" [maxLength]="200" [showCount]="false" placeholder="Tamaam FC Karachi" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="fc-city" class="font-medium">City <span class="text-red-600">*</span></label>
                <app-select-control inputId="fc-city" label="City" [control]="control('cityId')" [options]="cities()" optionLabel="name" optionValue="id" placeholder="Choose a city" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="fc-contact" class="font-medium">Receiving contact <span class="text-red-600">*</span></label>
                <app-input-control inputId="fc-contact" label="Receiving contact" [control]="control('contactName')" [maxLength]="200" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="fc-phone" class="font-medium">Contact phone <span class="text-red-600">*</span></label>
                <app-input-control inputId="fc-phone" label="Contact phone" type="tel" [control]="control('contactPhone')" [maxLength]="30" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2 md:col-span-2">
                <label for="fc-address" class="font-medium">Street address <span class="text-red-600">*</span></label>
                <app-input-control inputId="fc-address" label="Street address" [control]="control('addressLine1')" [maxLength]="300" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2 md:col-span-2">
                <label for="fc-address2" class="font-medium">Gate, dock, or landmark</label>
                <app-input-control inputId="fc-address2" label="Address line 2" [control]="control('addressLine2')" [maxLength]="300" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="fc-area" class="font-medium">Area</label>
                <app-input-control inputId="fc-area" label="Area" [control]="control('area')" [maxLength]="200" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="fc-postal" class="font-medium">Postal code</label>
                <app-input-control inputId="fc-postal" label="Postal code" [control]="control('postalCode')" [maxLength]="20" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="fc-hours" class="font-medium">Processing time (hours)</label>
                <app-input-control inputId="fc-hours" label="Processing time" type="number" [control]="control('processingTimeHours')" [showCount]="false" />
            </div>
            <div class="flex flex-col gap-2 md:col-span-2">
                <label for="fc-directions" class="font-medium">Delivery instructions for sellers</label>
                <app-input-control inputId="fc-directions" label="Delivery instructions" type="textarea" [control]="control('directions')" [maxLength]="500" [showCount]="false" placeholder="Receiving hours, dock number, appointment rules…" />
            </div>
            <label class="flex items-center gap-2">
                <input type="checkbox" [formControl]="control('isDefault')" />
                Default fulfillment center
            </label>
            <label class="flex items-center gap-2">
                <input type="checkbox" [formControl]="control('isActive')" />
                Open for inbound shipments
            </label>

            @if (error(); as message) {
                <app-error-state [message]="message" [retryable]="false" />
            }

            <div class="flex justify-end gap-2 md:col-span-2">
                <p-button label="Cancel" [outlined]="true" routerLink="/fulfillment/warehouses" />
                <p-button type="submit" label="Save" [loading]="saving()" />
            </div>
        </form>
    </div>
</div>
