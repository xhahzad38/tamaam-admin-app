<p-iconfield iconPosition="left" class="w-full max-w-full md:w-100">
    <p-inputicon>
        <i class="pi pi-search"></i>
    </p-inputicon>
    <input pInputText type="search" [placeholder]="placeholder()" [value]="value()" [attr.aria-label]="placeholder()" class="w-full" (input)="onInput($event)" (keydown.enter)="onEnter($event)" />
</p-iconfield>
