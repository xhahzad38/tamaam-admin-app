<app-bread-crumb [items]="crumbs" />

<div class="card">
    <h1 class="m-0 text-2xl font-semibold">Warranty rule</h1>
    <p class="m-0 mt-1 text-sm text-muted-color">Choose a category, then set whether its products need a warranty and a serial or IMEI.</p>

    @if (error()) {
        <p class="mt-4 text-red-600" role="alert">{{ error() }}</p>
    }
    @if (notice()) {
        <p class="mt-4 text-green-700" role="status">{{ notice() }}</p>
    }

    <div class="mt-4 grid max-w-xl gap-4">
        <div class="flex flex-col gap-1">
            <label class="text-sm font-medium" for="warranty-category">Category</label>
            <app-select-control inputId="warranty-category" label="Category" [control]="categoryId" [options]="categoryOptions()" optionLabel="label" optionValue="id" placeholder="Choose a category" [showClear]="false" appendTo="body" [flowError]="true" />
        </div>

        @if (loading()) {
            <p class="m-0 text-sm text-muted-color">Loading warranty rule…</p>
        }

        <label class="inline-flex items-center gap-2">
            <p-checkbox [binary]="true" [ngModel]="warranty().warrantyRequired" (ngModelChange)="patch({ warrantyRequired: $event })" />
            <span>Warranty required</span>
        </label>
        <div class="flex flex-col gap-1">
            <label class="text-sm font-medium" for="warranty-months">Minimum months</label>
            <app-input-control inputId="warranty-months" label="Minimum months" type="number" [control]="fields.controls.minDurationMonths" [showCount]="false" [flowError]="true" />
        </div>
        <label class="inline-flex items-center gap-2">
            <p-checkbox [binary]="true" [ngModel]="warranty().serialOrImeiRequired" (ngModelChange)="patch({ serialOrImeiRequired: $event })" />
            <span>Serial or IMEI required</span>
        </label>
        <div>
            <p-button label="Save warranty rule" [loading]="saving()" (onClick)="save()" />
        </div>
    </div>
</div>
